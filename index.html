<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
      <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style.css">
    <title>Signup-Page</title>
</head>
<body id="signup-page">

     <div id="signup-con">
     <h1>Signup</h1>
        <div class="inputs-sec">
               
        <div class="usernam">
            <label for="a">UserName<span>*</span></label>
            <br>
           <input type="text" id="usrname" name="a">
        </div>
        <div>
            <label for="b">Email<span>*</span></label>
            <br>
            <input type="text" id="email" name="b">
        </div>
        <div>
            <label for="c">Password<span>*</span></label>
            <br>
           <input type="password" id="pass" name="c">
        </div>

       <button id="signupBtn">Signup</button>
        <button id="loginBtn">Login</button>
        </div>

              
    </div>
    
        <script src="app.js"></script>
        <script type="module" src="./signup.js"></script>
    <script type="module" src="./login.js"></script>
</body>
</html>
